name: Coverage

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run coverage against (checks out refs/pull/<number>/merge)'
        required: false
        type: string
      ref:
        description: 'Git ref to checkout (branch, tag, or SHA). Ignored when pr_number is provided.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  unit-coverage:
    name: Unit Test Coverage
    runs-on: ubuntu-latest
    outputs:
      coverage_report: ${{ steps.capture-report.outputs.body }}
      pr_number: ${{ steps.resolve-ref.outputs.pr_number }}
    steps:
      - name: Resolve checkout ref
        id: resolve-ref
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_REF: ${{ inputs.ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "pr_number must be a positive integer" >&2
              exit 1
            fi

            HEAD_REPOSITORY="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name')"
            BASE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.sha')"
            if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "Manual coverage runs reject fork pull requests because they execute checked-out code." >&2
              exit 1
            fi

            echo "ref=refs/pull/${PR_NUMBER}/merge" >> "$GITHUB_OUTPUT"
            echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "Resolved ref: refs/pull/${PR_NUMBER}/merge"
          elif [ -n "$MANUAL_REF" ]; then
            git check-ref-format --allow-onelevel "$MANUAL_REF"
            echo "ref=${MANUAL_REF}" >> "$GITHUB_OUTPUT"
            echo "Resolved ref: ${MANUAL_REF}"
          else
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "Resolved ref: ${GITHUB_REF}"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve base SHA for manual PR run
        id: resolve-base
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        run: |
          BASE_SHA="${{ steps.resolve-ref.outputs.base_sha }}"
          git cat-file -e "${BASE_SHA}^{commit}"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run unit tests with coverage
        run: pnpm test:unit:coverage

      - name: Prepare baseline worktree
        id: baseline-worktree
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        run: |
          BASE_WORKTREE="$RUNNER_TEMP/coverage-baseline"
          rm -rf "$BASE_WORKTREE"
          git worktree add --detach "$BASE_WORKTREE" "${{ steps.resolve-base.outputs.base_sha }}"
          echo "path=$BASE_WORKTREE" >> "$GITHUB_OUTPUT"

      - name: Install baseline dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        working-directory: ${{ steps.baseline-worktree.outputs.path }}
        run: pnpm install --frozen-lockfile

      - name: Build baseline packages
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        working-directory: ${{ steps.baseline-worktree.outputs.path }}
        run: pnpm build

      - name: Run baseline unit tests with coverage
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        working-directory: ${{ steps.baseline-worktree.outputs.path }}
        run: pnpm test:unit:coverage

      - name: Build PR coverage report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' }}
        env:
          RESOLVED_REF: ${{ steps.resolve-ref.outputs.ref }}
          JOB_STATUS: ${{ job.status }}
          CODECOV_MAIN_BRANCH: main
          HEAD_COVERAGE_ROOT: ${{ github.workspace }}
          BASE_COVERAGE_ROOT: ${{ steps.baseline-worktree.outputs.path }}
          BASE_COVERAGE_REF: ${{ steps.resolve-base.outputs.base_sha }}
        run: node ./scripts/build-coverage-pr-report.mts

      - name: Capture coverage report
        id: capture-report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' && hashFiles('coverage-pr-report.md') != '' }}
        run: |
          DELIMITER="coverage-$(openssl rand -hex 16)"
          {
            echo "body<<${DELIMITER}"
            cat coverage-pr-report.md
            echo
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload coverage reports to Codecov
        if: ${{ github.event_name == 'push' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: |
            ./packages/angular/coverage/lcov.info
            ./packages/core/coverage/lcov.info
            ./packages/nuxt/coverage/lcov.info
            ./packages/react/coverage/lcov.info
            ./packages/svelte/coverage/lcov.info
            ./packages/vue/coverage/lcov.info

      - name: Cleanup baseline worktree
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' && steps.baseline-worktree.outputs.path != '' }}
        run: |
          git worktree remove --force "${{ steps.baseline-worktree.outputs.path }}" || true

  comment-coverage:
    name: Comment Coverage
    needs: unit-coverage
    if: ${{ always() && needs.unit-coverage.outputs.pr_number != '' && needs.unit-coverage.outputs.coverage_report != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment coverage report to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.unit-coverage.outputs.pr_number }}
          REPORT_BODY: ${{ needs.unit-coverage.outputs.coverage_report }}
        with:
          script: |
            const issueNumber = Number.parseInt(process.env.PR_NUMBER, 10)
            const body = process.env.REPORT_BODY
            if (!Number.isSafeInteger(issueNumber) || issueNumber < 1 || !body) {
              core.setFailed('Coverage report inputs are invalid')
              return
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body
            })
