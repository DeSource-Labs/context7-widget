<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Context7 Widget Core Test Demo</title>
    <style>
      :root {
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #07120c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .demo-shell {
        display: grid;
        gap: 1rem;
        grid-template-columns: 18rem minmax(0, 1fr);
        min-height: 100vh;
        padding: 1rem;
      }

      .demo-controls,
      .demo-stage {
        align-content: start;
        background: #101513;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        display: grid;
        gap: 0.8rem;
        min-width: 0;
        padding: 1rem;
      }

      label {
        color: rgba(248, 250, 252, 0.72);
        display: grid;
        font-size: 0.85rem;
        gap: 0.35rem;
      }

      .checkbox-control {
        align-items: center;
        grid-template-columns: auto minmax(0, 1fr);
      }

      input,
      select,
      button {
        font: inherit;
      }

      input[type='text'],
      select {
        background: #070b09;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 7px;
        color: #f8fafc;
        min-height: 2.4rem;
        padding: 0 0.7rem;
        width: 100%;
      }

      button {
        background: #7cffb2;
        border: 0;
        border-radius: 8px;
        color: #07120c;
        cursor: pointer;
        font-weight: 800;
        min-height: 2.55rem;
        padding: 0 0.9rem;
      }

      .event-log {
        background: #070b09;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        color: rgba(248, 250, 252, 0.78);
        font-family: 'SF Mono', Monaco, Consolas, monospace;
        line-height: 1.5;
        padding: 0.85rem;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 720px) {
        .demo-shell {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main class="demo-shell" data-testid="context7-demo">
      <section class="demo-controls" aria-label="Widget demo controls">
        <label>
          Theme
          <select data-testid="theme">
            <option value="auto">auto</option>
            <option value="light">light</option>
            <option value="dark">dark</option>
          </select>
        </label>
        <label>
          Preset
          <select data-testid="preset">
            <option value="default">default</option>
            <option value="minimal">minimal</option>
            <option selected value="glass">glass</option>
            <option value="neo">neo</option>
            <option value="terminal">terminal</option>
            <option value="brutalist">brutalist</option>
          </select>
        </label>
        <label>
          Position
          <select data-testid="position">
            <option value="bottom-right">bottom-right</option>
            <option value="bottom-left">bottom-left</option>
            <option value="top-right">top-right</option>
            <option value="top-left">top-left</option>
            <option value="center">center</option>
            <option selected value="anchor">anchor</option>
          </select>
        </label>
        <label>
          Trigger
          <select data-testid="trigger-mode">
            <option value="managed">managed</option>
            <option value="external">external</option>
            <option value="built-in">built-in</option>
          </select>
        </label>
        <label>
          Panel width
          <input data-testid="panel-width" type="text" value="420px" />
        </label>
        <label>
          Panel height
          <input data-testid="panel-height" type="text" value="460px" />
        </label>
        <label>
          Accent
          <input data-testid="accent" type="text" />
        </label>
        <label class="checkbox-control">
          <input data-testid="backdrop" type="checkbox" />
          Backdrop
        </label>
        <label class="checkbox-control">
          <input checked data-testid="close-outside" type="checkbox" />
          Close outside
        </label>
      </section>

      <section class="demo-stage">
        <button class="context7-widget-trigger" id="demo-managed-trigger" type="button">Ask docs</button>
        <button data-testid="external-trigger" hidden id="demo-external-trigger" type="button">
          External docs trigger
        </button>
        <button data-testid="programmatic-send" type="button">Programmatic send</button>
        <div class="event-log" data-testid="event-log"></div>
        <context7-widget
          close-on-outside-click="true"
          custom-trigger="#demo-managed-trigger"
          initial-message="Hello from the core demo for **{library}**."
          launcher-label="Ask docs"
          launcher-variant="pill"
          library="/desource-labs/context7-widget"
          panel-height="460px"
          panel-width="420px"
          placeholder="Ask docs..."
          position="anchor"
          preset="glass"
          theme="auto"
          dialog-title="Demo Docs"
          widget-id="demo-widget"
        ></context7-widget>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
