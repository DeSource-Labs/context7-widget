packages:
  - 'packages/*'
  - 'demo'

# Require releases to be at least one day old, including transitive dependencies.
minimumReleaseAge: 1440

# Nuxt's module builder and Angular 22 require different TypeScript lines.
# Resolve toolchain peers from each package so both constraints stay honest.
resolvePeersFromWorkspaceRoot: false

overrides:
  '@bomb.sh/tab': ^0.0.22
  brace-expansion: ^5.0.9
  glob: ^13.0.6
  # Fix GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g in Express's dependency tree.
  qs: ^6.16.0

# @nuxt/module-builder 1.0.3 requires vue-sfc-transformer 0.2.x while its
# bundled mkdist 2.4.1 still declares the compatible 0.1.x line.
peerDependencyRules:
  allowedVersions:
    'mkdist@2.4.1>vue-sfc-transformer': 0.2.5

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: false
  msgpackr-extract: false
